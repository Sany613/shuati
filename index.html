<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2563eb"><meta name="description" content="刷题通：多题库管理、智能练习、错题收藏、模拟考试、统计与离线 PWA">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><title>刷题通</title>
<style>
:root{--b:#2563eb;--b2:#1d4ed8;--bg:#f4f7fb;--card:#fff;--t:#172033;--m:#718096;--l:#e5eaf1;--g:#16a34a;--r:#dc2626;--o:#ea580c;--p:#7c3aed;--sh:0 8px 28px rgba(15,23,42,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:960px;margin:auto;min-height:100vh;padding-bottom:88px}
header{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.94);backdrop-filter:blur(16px);padding:13px 15px;border-bottom:1px solid #e9edf3}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900}.sub{font-size:11px;color:var(--m);margin-top:3px}.gear{border:0;background:#fff;width:42px;height:42px;border-radius:14px;box-shadow:var(--sh);font-size:20px}
main{padding:15px}.page{display:none}.page.on{display:block}.hero{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border-radius:24px;padding:20px;box-shadow:0 15px 35px rgba(37,99,235,.2)}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;line-height:1.65;font-size:13px;opacity:.93}.hero .mini{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.hero .mini span{background:rgba(255,255,255,.16);padding:6px 9px;border-radius:999px;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:#fff;border:1px solid var(--l);border-radius:16px;text-align:center;padding:12px 4px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--l);border-radius:19px;padding:15px;box-shadow:0 3px 18px rgba(15,23,42,.035)}.action{text-align:left;min-height:100px;border:1px solid var(--l);width:100%}.action .big{font-size:23px}.action b{display:block;margin:5px 0;font-size:15px}.action small{color:var(--m);line-height:1.5}.title{font-weight:900;margin:19px 2px 9px;font-size:18px}.sectionline{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:800;background:var(--b);color:#fff}.btn.secondary{background:#eef2ff;color:#3730a3}.btn.ghost{background:#fff;color:var(--t);border:1px solid var(--l)}.btn.danger{background:#fee2e2;color:#991b1b}.btn.green{background:#dcfce7;color:#166534}.btn.small{padding:8px 10px;font-size:12px}.btn:disabled{opacity:.45}
.field{width:100%;padding:11px 12px;border-radius:13px;border:1px solid var(--l);background:#fff;outline:none}.field:focus{border-color:#93c5fd}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}.rowbtn{display:flex;gap:8px;margin-top:10px}.rowbtn>*{flex:1}.checkrow{display:flex;gap:8px;align-items:center;padding:8px 0;font-size:13px}.checkrow input{width:18px;height:18px}
.progress,.bar{height:7px;background:#e7ecf3;border-radius:9px;overflow:hidden}.progress i,.bar i{display:block;height:100%;background:var(--b)}.quizbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.timer{font-variant-numeric:tabular-nums;color:var(--o);font-weight:900}.qcard{background:#fff;border:1px solid var(--l);border-radius:21px;padding:17px;margin-top:12px;box-shadow:var(--sh)}.qmeta{display:flex;justify-content:space-between;color:var(--m);font-size:11px;gap:7px}.qtext{font-size:18px;font-weight:800;line-height:1.65;margin:14px 0}.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:15px;padding:12px;margin:8px 0;line-height:1.55}.opt.sel{background:#eff6ff;border-color:#93c5fd}.opt.ok{background:#f0fdf4;border-color:#86efac}.opt.bad{background:#fef2f2;border-color:#fca5a5}.letter{flex:none;width:27px;height:27px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:850}.fb{margin-top:10px;padding:11px 12px;border-radius:13px;font-size:13px;line-height:1.55}.fb.ok{background:#f0fdf4;color:#166534}.fb.bad{background:#fef2f2;color:#991b1b}.answergrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.answergrid button{border:0;border-radius:10px;padding:8px 0;background:#f1f5f9}.answergrid .answered{background:#dbeafe;color:#1d4ed8}.answergrid .right{background:#dcfce7;color:#166534}.answergrid .wrong{background:#fee2e2;color:#991b1b}
.list{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--l);border-radius:15px;padding:13px}.item p{margin:7px 0;line-height:1.55}.pill{display:inline-block;background:#eff6ff;color:var(--b);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.muted{color:var(--m)}.empty{text-align:center;color:var(--m);padding:35px 10px}.dangertext{color:#b91c1c}.oktext{color:#15803d}.library{display:flex;align-items:center;gap:10px}.libicon{width:40px;height:40px;border-radius:13px;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}.libmain{min-width:0;flex:1}.libname{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:10px;color:var(--m);margin-top:3px}.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:11px 12px;border-radius:14px;font-size:12px;line-height:1.6}
.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(15px);border-top:1px solid var(--l);padding:7px 9px calc(7px + env(safe-area-inset-bottom))}.nav{max-width:960px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:#7c8798;border-radius:12px;padding:5px 2px;font-size:10px}.nav button.on{background:#eff6ff;color:var(--b);font-weight:850}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;align-items:flex-end}.modal.on{display:flex}.sheet{position:relative;background:#fff;width:100%;max-width:960px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:90vh;overflow:auto}.sheet-close{position:absolute;right:14px;top:12px;border:0;background:#f1f5f9;color:#475569;border-radius:50%;width:36px;height:36px;font-size:22px;line-height:36px;padding:0}.sheet-close:active{transform:scale(.95)}.sheet h3{margin:0 0 12px}.sheet .stack{display:grid;gap:8px}.sheet .close{position:absolute;right:15px;top:10px;border:0;background:#f1f5f9;border-radius:50%;width:34px;height:34px}
.toast{position:fixed;z-index:100;bottom:94px;left:50%;transform:translate(-50%,10px);opacity:0;background:#111827;color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;transition:.2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}.examresult{text-align:center}.score{font-size:54px;font-weight:900;color:var(--b);margin:12px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.chips button{white-space:nowrap;border:1px solid var(--l);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px}.chips button.on{background:#eff6ff;color:var(--b);border-color:#bfdbfe}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 5px;border-bottom:1px solid var(--l);text-align:left}.hidden{display:none!important}.convert-preview{max-height:280px;overflow:auto;border:1px solid var(--l);border-radius:12px;background:#f8fafc;padding:8px;font-size:12px}.convert-row{padding:8px 0;border-bottom:1px solid var(--l)}.convert-row:last-child{border-bottom:0}.filehint{font-size:11px;line-height:1.5;color:#64748b}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.filters{grid-template-columns:repeat(4,1fr)}.full{grid-column:auto}.sheet{border-radius:24px;margin:auto}.bottom{padding-bottom:9px}}

.brand-version{display:inline-block;margin-left:5px;padding:1px 6px;border:1px solid currentColor;border-radius:999px;font-size:.55em;font-weight:600;opacity:.65;vertical-align:middle;line-height:1.25}
</style></head>
<body>
<div class="app"><header><div class="top"><div><div class="brand">刷题通 <span class="brand-version">V6.12</span></div><div class="sub" id="subhead">多题库 · 智能练习 · 模拟考试</div></div><button class="gear" onclick="settings()">⚙️</button></div></header>
<main><section id="home" class="page on"></section><section id="practice" class="page"></section><section id="wrong" class="page"></section><section id="fav" class="page"></section><section id="stats" class="page"></section><section id="quiz" class="page"></section></main>
<div class="bottom"><nav class="nav"><button data-p="home" onclick="go('home')"><i>⌂</i>首页</button><button data-p="practice" onclick="go('practice')"><i>◉</i>练习</button><button data-p="wrong" onclick="go('wrong')"><i>✕</i>错题</button><button data-p="fav" onclick="go('fav')"><i>☆</i>收藏</button><button data-p="stats" onclick="go('stats')"><i>▥</i>统计</button></nav></div></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script src="./questions.js"></script>
<script>
'use strict';
const BUILTIN=Array.isArray(window.BUILTIN_QUESTIONS)?window.BUILTIN_QUESTIONS:[];
const STORE='military_quiz_v6_1';
const OLD_STORES=['military_quiz_v5','military_quiz_v4_complete'];
const base={libraries:{},active:'builtin',answered:{},wrong:{},fav:{},attempts:0,right:0,studySeconds:0,days:{},plans:{daily:20},settings:{autoNext:false},history:[]};
let S, sess=null, installPrompt=null, timerHandle=null;
function fresh(){return JSON.parse(JSON.stringify(base));}
function normalizeState(x){S=Object.assign(fresh(),x||{});S.libraries=S.libraries||{};S.answered=S.answered||{};S.wrong=S.wrong||{};S.fav=S.fav||{};S.days=S.days||{};S.plans=Object.assign({daily:20},S.plans||{});S.settings=Object.assign({autoNext:false},S.settings||{});S.history=S.history||[];return S;}
try{let raw=localStorage.getItem(STORE);if(!raw){for(const name of OLD_STORES){raw=localStorage.getItem(name);if(raw)break}}S=normalizeState(raw?JSON.parse(raw):null);if(!localStorage.getItem(STORE))save();}catch(e){S=fresh();}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){toast('本地存储空间不足，请先导出学习记录');}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('on'),1800);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function key(lib,id){return lib+':'+id;}
function getLibs(){const a=[{id:'builtin',name:'军事理论题库（2025）',count:BUILTIN.length,builtin:true}];for(const [id,v] of Object.entries(S.libraries)){if(id!=='builtin')a.push({id,name:v.name,count:(v.questions||[]).length,builtin:false});}return a;}
function getLib(id){if(id==='builtin')return {id,name:'军事理论题库（2025）',questions:BUILTIN,builtin:true};return S.libraries[id];}
function current(){return getLib(S.active)||getLib('builtin');}
function qs(){return current().questions||[];}
function types(){return [...new Set(qs().map(x=>x.type).filter(Boolean))]}
function chapters(){return [...new Set(qs().map(x=>x.chapter).filter(Boolean))]}
function diffs(){return [...new Set(qs().map(x=>x.difficulty).filter(Boolean))]}
function go(id){clearInterval(timerHandle);document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('on',e.dataset.p===id));try{({home,practice,wrong,fav:favoritePage,stats}[id]||home)();}catch(e){console.error(e);document.getElementById(id).innerHTML='<div class="card"><b>页面加载失败</b><p class="muted">请刷新页面；如果仍然出现问题，请清除站点数据后重新打开。</p></div>';}}
function touchDay(){const d=today();S.days[d]=S.days[d]||0;save();}
function home(){const q=qs(),done=q.filter(x=>S.answered[key(S.active,x.id)]).length,wrongN=q.filter(x=>S.wrong[key(S.active,x.id)]).length,favN=q.filter(x=>S.fav[key(S.active,x.id)]).length;const total=S.attempts||0,acc=total?Math.round(S.right/total*100):0,todayN=S.days[today()]||0;document.getElementById('subhead').textContent=`${q.length}题 · ${current().name} · 本地学习`;
document.getElementById('home').innerHTML=`<div class="hero"><h1>刷题通</h1><p>现在支持多题库管理、随机/专项练习、错题收藏、正式模拟、答题卡、统计分析，以及题库文件导入。</p><div class="mini"><span>📚 ${q.length}题</span><span>🧠 已做 ${done}</span><span>🎯 正确率 ${acc}%</span></div></div>
<div class="stats"><div class="stat"><b>${q.length}</b><span>当前题库</span></div><div class="stat"><b>${done}</b><span>已练题</span></div><div class="stat"><b>${wrongN}</b><span>错题</span></div><div class="stat"><b>${favN}</b><span>收藏</span></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>今日进度 ${todayN}/${S.plans.daily}</b><button class="btn ghost small" onclick="setDaily()">目标</button></div><div class="bar" style="margin-top:9px"><i style="width:${Math.min(100,todayN/Math.max(1,S.plans.daily)*100)}%"></i></div><small class="muted">累计作答 ${S.attempts} 次 · 选择的题库：${esc(current().name)}</small></div>
<div class="title">开始刷题</div><div class="grid"><button class="card action" onclick="start({n:20,random:true})"><span class="big">🎲</span><b>随机 20 题</b><small>优先抽取未练题</small></button><button class="card action" onclick="start({n:50,random:true})"><span class="big">🔥</span><b>冲刺 50 题</b><small>集中刷一轮</small></button><button class="card action" onclick="wrongStart()"><span class="big">❌</span><b>错题重练</b><small>${wrongN?wrongN+' 道错题待巩固':'目前没有错题'}</small></button><button class="card action" onclick="mock()"><span class="big">⏱️</span><b>正式模拟</b><small>自定义题量 · 自定义时间 · 自动计时</small></button></div>
<div class="title">更多</div><div class="grid"><button class="card action" onclick="custom()"><span class="big">🎯</span><b>自定义练习</b><small>章节、题型、难度、数量</small></button><button class="card action" onclick="searchPage()"><span class="big">🔎</span><b>搜索题库</b><small>题干、选项、章节均可搜</small></button><button class="card action" onclick="libraryManager()"><span class="big">📚</span><b>题库管理</b><small>导入、切换、合并、去重</small></button><button class="card action" onclick="exportData()"><span class="big">💾</span><b>备份学习记录</b><small>换手机也能恢复</small></button></div></div>`;}
function practice(){const q=qs();document.getElementById('practice').innerHTML=`<div class="title">练习中心</div><div class="chips"><button class="on" onclick="start({n:20,random:true})">随机</button><button onclick="start({n:20,random:false})">顺序</button><button onclick="wrongStart()">错题</button><button onclick="favStart()">收藏</button></div><div class="title">当前题库：${esc(current().name)}</div><div class="card"><b>${q.length} 题</b><p class="muted">支持单选、多选、判断、填空；练习模式即时判分并自动记录错题。</p><button class="btn" onclick="custom()">打开自定义练习</button></div><div class="title">题型</div><div class="grid">${types().map(t=>`<button class="card action" onclick='start({n:20,random:true,type:${JSON.stringify(t)}})'><span class="big">${t==='单选题'?'🔘':t==='多选题'?'☑️':t==='判断题'?'✅':'✍️'}</span><b>${esc(t)}</b><small>${q.filter(x=>x.type===t).length} 题</small></button>`).join('')}</div>`;}
function start(o={}){let pool=(o.pool||qs()).slice();if(o.type)pool=pool.filter(q=>q.type===o.type);if(o.chapter)pool=pool.filter(q=>q.chapter===o.chapter);if(o.difficulty)pool=pool.filter(q=>q.difficulty===o.difficulty);if(o.unanswered){const u=pool.filter(q=>!S.answered[key(S.active,q.id)]);pool=u.length?u:pool;}if(o.wrongOnly)pool=pool.filter(q=>S.wrong[key(S.active,q.id)]);if(o.favOnly)pool=pool.filter(q=>S.fav[key(S.active,q.id)]);if(o.random)pool=shuffle(pool);const n=Math.min(o.n||20,pool.length);pool=pool.slice(0,n);if(!pool.length){toast('当前筛选下没有题目');return;}const visible=[...document.querySelectorAll('.page.on')][0];const from=(visible&&visible.id&&visible.id!=='quiz')?visible.id:'home';sess={lib:S.active,list:pool,i:0,ans:{},checked:{},recorded:{},kind:o.kind||'practice',mode:o.mode||'practice',limit:o.limit||0,start:Date.now(),from};try{history.pushState({app:true,quiz:true},'',location.href)}catch(e){}go('quiz');renderQuiz();}
function wrongStart(){const pool=qs().filter(q=>S.wrong[key(S.active,q.id)]);start({pool,n:pool.length,random:true,kind:'wrong',wrongOnly:true});}
function favStart(){const pool=qs().filter(q=>S.fav[key(S.active,q.id)]);start({pool,n:pool.length,random:true,kind:'fav'});}
function mock(){
const total=qs().length;
document.getElementById('sheet').innerHTML=`<h3>⏱️ 正式模拟</h3><p class="muted">自定义本次模拟的题目数量和考试时间。系统会随机抽题，进入后按整卷模式计时，最后统一交卷。</p><div class="stack"><label>题目数量<input id="examN" class="field" type="number" min="1" max="${Math.max(1,total)}" value="50"></label><label>考试时间（分钟）<input id="examMin" class="field" type="number" min="1" max="600" value="45"></label><div class="notice">📌 当前题库共 ${total} 题；题目数量不能超过当前题库数量。</div><button class="btn" onclick="runMockCustom()">开始模拟</button></div>`;
addModalClose();document.getElementById('modal').classList.add('on');
}
function runMockCustom(){
const total=qs().length;
const n=Math.max(1,Math.min(total,parseInt(document.getElementById('examN').value,10)||50));
const min=Math.max(1,Math.min(600,parseInt(document.getElementById('examMin').value,10)||45));
closeModal();
start({pool:shuffle(qs()),n,kind:'mock',mode:'exam',limit:min*60});
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function ans(q){return String(q.answer??'').trim().toUpperCase()}
function multi(q){return q.type==='多选题'}
function chosen(q){return Array.isArray(sess.ans[q.id])?sess.ans[q.id]:[]}
function toggle(q,l){if(sess.checked[q.id]&&sess.mode!=='exam')return;let a=chosen(q);a=multi(q)?(a.includes(l)?a.filter(x=>x!==l):[...a,l]):[l];a.sort();sess.ans[q.id]=a;renderQuiz();}
function setFill(q,v){if(!sess)return;sess.ans[q.id]=[String(v??'')]}
function setFillCurrent(v){if(!sess)return;const q=sess.list?.[sess.i];if(q&&q.type==='填空题')setFill(q,v)}
function cleanMultiAnswer(x){return String(x??'').toUpperCase().replace(/[\s\u3000,，、;；+＋|\/\\]/g,'').replace(/[^ABCD]/g,'')}
function syncCurrentInput(){const el=document.getElementById('fill');if(el&&sess&&sess.list?.[sess.i]?.type==='填空题'){setFill(sess.list[sess.i],el.value)}}
function correct(q){let a=chosen(q);if(q.type==='判断题')return (a[0]==='A')===(ans(q)==='T'||ans(q)==='正确');if(q.type==='填空题')return norm(a[0])===norm(ans(q));return cleanMultiAnswer(a.slice().sort().join(''))===cleanMultiAnswer(ans(q).split('').sort().join(''))}
function norm(x){return String(x??'').trim().replace(/[\s　]+/g,'').toLowerCase()}
function record(q,ok){const k=key(sess.lib,q.id);if(sess.recorded[k])return;sess.recorded[k]=true;S.attempts++;if(ok){S.right++;delete S.wrong[k]}else S.wrong[k]=1;S.answered[k]=(S.answered[k]||0)+1;S.days[today()]=(S.days[today()]||0)+1;S.history.unshift({time:new Date().toISOString(),lib:sess.lib,id:q.id,ok});S.history=S.history.slice(0,1000);save();}
function checkCurrent(){const q=sess.list[sess.i];if(!chosen(q).length)return toast('先选择或填写答案');sess.checked[q.id]=true;record(q,correct(q));renderQuiz();if(correct(q)&&S.settings.autoNext)setTimeout(next,500);}
function submitExam(){for(const q of sess.list){if(chosen(q).length){sess.checked[q.id]=true;record(q,correct(q));}}finish();}
function next(){syncCurrentInput();if(sess.mode==='exam'){if(sess.i<sess.list.length-1){sess.i++;renderQuiz()}else submitExam()}else{if(sess.i<sess.list.length-1){sess.i++;renderQuiz()}else finish()}}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderQuiz(){if(!sess||!sess.list.length)return;const q=sess.list[sess.i];const quiz=document.getElementById('quiz');const left=sess.limit?Math.max(0,sess.limit-Math.floor((Date.now()-sess.start)/1000)):0;if(sess.limit&&left<=0){submitExam();return}if(sess.limit){clearInterval(timerHandle);timerHandle=setInterval(renderQuiz,1000)}const checked=!!sess.checked[q.id]&&sess.mode!=='exam';const arr=q.type==='判断题'?[['A','正确'],['B','错误']]:['A','B','C','D'].map((l,i)=>[l,q.options?.[i]||'']).filter(x=>x[1]);let opts='';if(q.type==='填空题'){opts=`<input id="fill" class="field" placeholder="请输入答案" value="${esc(chosen(q)[0]||'')}" ${checked?'disabled':''} oninput="setFillCurrent(this.value)">`;}else{opts=arr.map(([l,t])=>{let cls=chosen(q).includes(l)?'sel':'';if(checked)cls=correct(q)?'ok':(chosen(q).includes(l)?'bad':'');return `<button type="button" aria-pressed="${chosen(q).includes(l)?'true':'false'}" class="opt ${cls}" ${checked?'disabled':''} onclick='toggle(${JSON.stringify(q).replace(/'/g,'&#39;')},"${l}")'><span class="letter">${l}</span><span>${esc(t)}</span>${multi(q)&&chosen(q).includes(l)?'<span style="margin-left:auto;font-weight:900">✓</span>':''}</button>`}).join('')}
let fb='';if(checked){const ok=correct(q);fb=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'回答正确 ✓':'回答错误 ✗'}</b><br>正确答案：${esc(q.type==='判断题'?(ans(q)==='T'?'正确':'错误'):ans(q))}</div>`}
quiz.innerHTML=`<div class="quizbar"><button class="btn ghost" onclick="confirmExit()">← 返回</button><span>${sess.limit?`<span class="timer">⏱ ${fmt(left)}</span>　`:''}${sess.i+1}/${sess.list.length}</span></div><div class="progress"><i style="width:${(sess.i+1)/sess.list.length*100}%"></i></div><div class="qcard"><div class="qmeta"><span><b>${esc(q.type)}${q.type==='多选题'?'（多选题）':''}</b>${q.type==='多选题'?' · 可同时选择多个选项':''} · ${esc(q.chapter||'')} · ${esc(current().name)}</span><button class="btn ghost small" onclick="fav(${q.id})">${S.fav[key(sess.lib,q.id)]?'⭐ 已收藏':'☆ 收藏'}</button></div><div class="qtext">${esc(q.question)}</div>${opts}${fb}<div class="rowbtn">${sess.i>0?'<button class="btn ghost" onclick="sess.i--;renderQuiz()">上一题</button>':''}<button class="btn" onclick="${sess.mode==='exam'?'next()':(checked?(sess.i===sess.list.length-1?'finish()':'next()'):'checkCurrent()')}">${sess.mode==='exam'?(sess.i===sess.list.length-1?'交卷':'下一题'):(checked?(sess.i===sess.list.length-1?'完成':'下一题'):'确认答案')}</button></div></div><div class="title">答题卡</div><div class="card answergrid">${sess.list.map((x,i)=>`<button class="${sess.checked[x.id]?(correct(x)?'right':'wrong'):chosen(x).length?'answered':''}" onclick="sess.i=${i};renderQuiz()">${i+1}</button>`).join('')}</div>`;}
function finish(){clearInterval(timerHandle);const n=sess.list.length,score=sess.list.filter(q=>sess.checked[q.id]&&correct(q)).length,pct=Math.round(score/n*100);const isExam=sess.kind==='mock'&&sess.mode==='exam';let level='',enc='';if(isExam){if(pct>=85){level='优秀';enc=['太棒了！这次发挥非常出色，继续保持这个状态！','优秀成绩！你的基础和临场发挥都很稳。','漂亮！85%+，这份答卷很有含金量。'][Math.floor(Math.random()*3)];}else if(pct>=60){level='合格';enc=['恭喜合格！已经达标，继续刷题把正确率冲上85%！','稳稳合格！再认真巩固错题，你离优秀只差一步。','通过考试！保持练习，下一次争取优秀。'][Math.floor(Math.random()*3)];}else{level='不合格';enc=['这次没关系，错题就是下一次提分的地图。再来一套！','暂时没有达标并不代表做不到，针对错题练一遍再试试。','别灰心！把错题吃透，60%并不遥远。'][Math.floor(Math.random()*3)];}}else{enc=pct>=85?'表现很棒！继续保持！':pct>=60?'不错！继续巩固，正确率还可以再往上冲。':'别着急，错题多练几遍，进步会很明显。';}S.history.unshift({time:new Date().toISOString(),lib:sess.lib,kind:sess.kind,score,n,pct,level:level||undefined});S.history=S.history.slice(0,1000);save();document.getElementById('quiz').innerHTML=`<div class="card examresult"><div class="muted">${isExam?'正式考试结束':'练习完成'}</div><div class="score">${score}<span style="font-size:22px">/${n}</span></div>${isExam?`<div class="notice" style="font-size:18px;font-weight:800;margin:10px 0">${level}</div>`:''}<h2>得分 ${score} 分</h2><p class="muted">每题1分 · 正确率 ${pct}%</p><div class="card" style="margin-top:12px;background:#f8fafc"><b>💬 ${enc}</b></div>${isExam?'<p class="muted" style="margin-top:10px">评分标准：≥85% 优秀　≥60% 合格　＜60% 不合格</p>':''}</div><div class="grid" style="margin-top:10px"><button class="card action" onclick="wrongStart()">❌<b>重做错题</b><small>趁热巩固</small></button><button class="card action" onclick="start({n:20,random:true})">🎲<b>再刷20题</b><small>继续练习</small></button></div><div class="title">本次答题卡</div><div class="card answergrid">${sess.list.map((q,i)=>`<button class="${sess.checked[q.id]?(correct(q)?'right':'wrong'):'answered'}" onclick="sess.i=${i};renderQuiz()">${i+1}</button>`).join('')}</div><button class="btn" style="width:100%;margin-top:12px" onclick="const p=sess?.from||'home';sess=null;go(p)">返回练习</button>`;}
function fav(id){const k=key(sess.lib,id);S.fav[k]=!S.fav[k];if(!S.fav[k])delete S.fav[k];save();renderQuiz()}
function wrong(){const q=qs().filter(x=>S.wrong[key(S.active,x.id)]);document.getElementById('wrong').innerHTML=`<div class="sectionline"><div class="title">错题本 <span class="muted">(${q.length})</span></div><button class="btn danger small" onclick="clearWrong()">清空当前</button></div><div class="rowbtn"><button class="btn" onclick="wrongStart()">随机重练</button><button class="btn ghost" onclick="searchPage('wrong')">在错题中找题</button></div><div class="list" style="margin-top:10px">${q.length?q.map(q=>itemHtml(q,'wrong')).join(''):'<div class="empty">🎉 当前题库没有错题</div>'}</div>`;}
function favoritePage(){const q=qs().filter(x=>S.fav[key(S.active,x.id)]);document.getElementById('fav').innerHTML=`<div class="sectionline"><div class="title">收藏夹 <span class="muted">(${q.length})</span></div><button class="btn ghost small" onclick="favStart()">开始刷</button></div><div class="list">${q.length?q.map(q=>itemHtml(q,'fav')).join(''):'<div class="empty">还没有收藏题目</div>'}</div>`;}
function itemHtml(q,mode){return `<div class="item"><div onclick="openOne(${q.id})"><span class="pill">${esc(q.type)}</span><span class="muted" style="font-size:10px;margin-left:6px">${esc(q.chapter||'')}</span><p><b>${esc(q.question)}</b></p><small class="muted">答案：${esc(q.type==='判断题'?(ans(q)==='T'?'正确':'错误'):ans(q))}</small></div><div class="rowbtn"><button class="btn ghost small" onclick="openOne(${q.id})">立即练</button>${mode==='wrong'?`<button class="btn green small" onclick="removeWrong(${q.id})">标记掌握</button>`:`<button class="btn ghost small" onclick="removeFav(${q.id})">取消收藏</button>`}</div></div>`;}
function openOne(id){const q=qs().find(x=>x.id===id);if(q)start({pool:[q],n:1,kind:'single'});}
function removeWrong(id){delete S.wrong[key(S.active,id)];save();wrong();toast('已移出错题本')}
function removeFav(id){delete S.fav[key(S.active,id)];save();favoritePage();toast('已取消收藏')}
function clearWrong(){if(confirm('清空当前题库的全部错题？')){for(const q of qs())delete S.wrong[key(S.active,q.id)];save();wrong();}}
function searchPage(from=''){document.getElementById('searchPage')?.remove();const holder=document.createElement('section');holder.id='searchPage';holder.className='page on';holder.innerHTML=`<div class="sectionline"><div class="title">搜索题库</div><button class="btn ghost small" onclick="go('home');document.getElementById('searchPage')?.remove()">返回</button></div><input id="searchBox" class="field" placeholder="搜索题干、选项、章节、答案..." oninput="doSearch('${from}')"><div id="searchList" class="list" style="margin-top:10px"><div class="empty">输入关键词开始搜索</div></div>`;document.querySelector('main').appendChild(holder);document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e===holder));document.querySelectorAll('.nav button').forEach(e=>e.classList.remove('on'));setTimeout(()=>document.getElementById('searchBox').focus(),50);}
function doSearch(from){const v=(document.getElementById('searchBox').value||'').trim().toLowerCase();let a=v?qs().filter(q=>[q.question,q.chapter,q.type,q.difficulty,q.answer,...(q.options||[])].join(' ').toLowerCase().includes(v)).slice(0,100):[];document.getElementById('searchList').innerHTML=a.length?a.map(q=>itemHtml(q,'search')).join(''):'<div class="empty">'+(v?'没有找到匹配题目':'输入关键词开始搜索')+'</div>';}
function stats(){const q=qs(),done=q.filter(x=>S.answered[key(S.active,x.id)]).length,wrongN=q.filter(x=>S.wrong[key(S.active,x.id)]).length,favN=q.filter(x=>S.fav[key(S.active,x.id)]).length,total=S.attempts||0,acc=total?Math.round(S.right/total*100):0;const days=Object.entries(S.days).sort().slice(-14);const ch=chapters().map(c=>{const a=q.filter(x=>x.chapter===c),d=a.filter(x=>S.answered[key(S.active,x.id)]).length,w=a.filter(x=>S.wrong[key(S.active,x.id)]).length;return {c,n:a.length,d,w}});document.getElementById('stats').innerHTML=`<div class="title">学习统计</div><div class="stats"><div class="stat"><b>${total}</b><span>累计作答</span></div><div class="stat"><b>${acc}%</b><span>总正确率</span></div><div class="stat"><b>${done}</b><span>当前库已做</span></div><div class="stat"><b>${wrongN}</b><span>当前库错题</span></div></div><div class="card"><b>当前题库：${esc(current().name)}</b><p class="muted">已练 ${done}/${q.length} · 收藏 ${favN} · 错题 ${wrongN}</p><div class="bar"><i style="width:${q.length?done/q.length*100:0}%"></i></div></div><div class="title">最近14天</div><div class="card">${days.length?days.map(([d,n])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--l)"><span>${d}</span><b>${n}题</b></div>`).join(''):'<p class="muted">还没有学习记录</p>'}</div><div class="title">章节表现</div><div class="card">${ch.map(x=>`<div style="margin:11px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${esc(x.c)}</span><span>已做 ${x.d}/${x.n} · 错 ${x.w}</span></div><div class="bar" style="margin-top:5px"><i style="width:${x.n?x.d/x.n*100:0}%"></i></div></div>`).join('')}</div>`;}
function closeModal(){const m=document.getElementById('modal');if(m)m.classList.remove('on');}

function custom(){const ts=types(),cs=chapters(),ds=diffs();document.getElementById('sheet').innerHTML=`<h3>🎯 自定义练习</h3><div class="stack"><label>题型<select id="fType" class="field"><option value="">全部题型</option>${ts.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>章节<select id="fChapter" class="field"><option value="">全部章节</option>${cs.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>难度<select id="fDiff" class="field"><option value="">全部难度</option>${ds.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>数量<input id="fN" class="field" type="number" min="1" max="500" value="20"></label><label class="checkrow"><input id="fUn" type="checkbox" checked> 优先抽取未练题</label><button class="btn" onclick="runCustom()">开始练习</button></div>`;addModalClose();document.getElementById('modal').classList.add('on');}

function settings(){document.getElementById('sheet').innerHTML=`<h3>⚙️ 设置与数据</h3><div class="stack"><button class="btn" onclick="libraryManager()">📚 题库管理</button><button class="btn secondary" onclick="exportData()">💾 导出学习记录</button><button class="btn secondary" onclick="document.getElementById('learnFile').click()">📥 导入学习记录</button><button class="btn ghost" onclick="setDaily()">🎯 设置每日目标</button><label class="checkrow"><input type="checkbox" ${S.settings.autoNext?'checked':''} onchange="S.settings.autoNext=this.checked;save()"> 答对后自动进入下一题</label><button class="btn ghost" onclick="install()">📱 安装到手机桌面</button><button class="btn danger" onclick="reset()">清空全部学习记录</button><input id="learnFile" type="file" accept=".json" hidden onchange="importData(this.files[0])"><p class="muted" style="font-size:12px;line-height:1.6">学习记录保存在本设备浏览器。题库可以单独导入、删除、导出和合并。首次导入 Excel 需要在线加载解析器，之后可继续本地使用。</p></div>`;addModalClose();document.getElementById('modal').classList.add('on');}
function libraryManager(){document.getElementById('sheet').innerHTML=`<h3>📚 题库管理</h3><div class="notice">当前内置题库不会被删除。导入的题库只保存在本设备；你可以切换题库、导出、删除或合并题库。</div><div class="stack" style="margin-top:10px">${getLibs().map(l=>`<div class="card library"><div class="libicon">${l.builtin?'🎖️':'📘'}</div><div class="libmain"><div class="libname">${esc(l.name)} ${S.active===l.id?'<span class="pill">使用中</span>':''}</div><div class="tag">${l.count} 题 · ${l.builtin?'内置题库':'本地导入'}</div></div><button class="btn ${S.active===l.id?'ghost':''} small" onclick="switchLib('${esc(l.id)}')">${S.active===l.id?'当前':'切换'}</button>${!l.builtin?`<button class="btn ghost small" onclick="exportLibrary('${esc(l.id)}')">导出</button><button class="btn danger small" onclick="deleteLibrary('${esc(l.id)}')">删除</button>`:''}</div>`).join('')}<div class="rowbtn"><button class="btn" onclick="document.getElementById('qFile').click()">➕ 导入题库</button><button class="btn secondary" onclick="document.getElementById('mergeFile').click()">🔄 导入并合并</button><button class="btn ghost" onclick="converter()">🛠️ 格式转换器</button></div><input id="qFile" type="file" accept=".json,.csv,.txt,.xlsx,.xls" hidden onchange="importQuestionFile(this.files[0],false)"><input id="mergeFile" type="file" accept=".json,.csv,.txt,.xlsx,.xls" hidden onchange="importQuestionFile(this.files[0],true)"><p class="muted" style="font-size:11px">支持 JSON / CSV / TXT / XLSX / XLS。文件只在本机浏览器解析，不上传题库。</p></div>`;addModalClose();document.getElementById('modal').classList.add('on');}
function switchLib(id){if(!getLib(id))return;S.active=id;save();closeModal();go('home');toast('已切换到 '+current().name)}
function deleteLibrary(id){if(!confirm('删除这个本地题库？学习记录也会从当前设备移除。'))return;delete S.libraries[id];for(const p of ['answered','wrong','fav'])for(const k of Object.keys(S[p]))if(k.startsWith(id+':'))delete S[p][k];if(S.active===id)S.active='builtin';save();libraryManager();toast('题库已删除')}
function exportLibrary(id){const l=getLib(id);if(!l)return;download(JSON.stringify({name:l.name,questions:l.questions},null,2),l.name+'.json','application/json');}
function exportData(){download(JSON.stringify(S,null,2),'刷题通_学习记录.json','application/json');toast('学习记录已导出')}
function download(text,name,type){const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x!=='object')throw 0;S=normalizeState(x);save();closeModal();go('home');toast('学习记录已恢复')}catch(e){toast('学习记录文件无效')}};r.readAsText(f)}
function setDaily(){const n=prompt('每天刷多少题？',S.plans.daily);if(n&&+n>0){S.plans.daily=Math.min(2000,+n);save();closeModal();home();toast('每日目标已设置')}}
function reset(){if(confirm('确定清空所有错题、收藏、统计和学习记录吗？题库不会删除。')){const libs=S.libraries,active=S.active;S=fresh();S.libraries=libs;S.active=active;save();closeModal();go('home');toast('学习记录已清空')}}

function install(){if(installPrompt){installPrompt.prompt();installPrompt.userChoice.then(()=>installPrompt=null)}else toast('请使用浏览器菜单中的“添加到主屏幕/安装应用”')}

function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++;}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function normalizeImported(raw){
  let a=Array.isArray(raw)?raw:(raw.questions||raw.data||raw.items||[]);
  if(!Array.isArray(a))throw new Error('no questions');
  const pick=(x,names)=>{for(const n of names){if(x&&x[n]!==undefined&&x[n]!==null&&String(x[n]).trim()!=='')return x[n]}return ''};
  return a.map((x,i)=>{
    if(typeof x==='string')return {id:i+1,subject:'',chapter:'',type:'填空题',difficulty:'',question:x,options:['','','',''],answer:''};
    const optionsObj=x.options&&typeof x.options==='object'&&!Array.isArray(x.options)?x.options:null;
    let options=Array.isArray(x.options)?x.options.slice(0,4):[
      pick(optionsObj,['A','a','选项A','选项a'])||pick(x,['A','a','选项A','选项a','optionA','选项1']),
      pick(optionsObj,['B','b','选项B','选项b'])||pick(x,['B','b','选项B','选项b','optionB','选项2']),
      pick(optionsObj,['C','c','选项C','选项c'])||pick(x,['C','c','选项C','选项c','optionC','选项3']),
      pick(optionsObj,['D','d','选项D','选项d'])||pick(x,['D','d','选项D','选项d','optionD','选项4'])
    ].map(v=>v??'');
    let type=pick(x,['type','题型','questionType','类型']);
    let answer=pick(x,['answer','答案','correct','correctAnswer','正确答案','参考答案']);
    const question=String(pick(x,['question','题目要求','题目','title','题干','题目内容'])||'').trim();

   else if(id===0x027E){const row=u16(a,d),c=u16(a,d+2),rk=u32(a,d+6);if(!rows[row])rows[row]=[];let v;if(rk&2)v=i32(a,d+6)>>2;else{const tmp=new Uint8Array(8);tmp.set(a.subarray(d+6,d+10));v=f64(tmp,0);}if(rk&1)v/=100;rows[row][c]=String(v);}
   else if(id===0x0205){const row=u16(a,d),c=u16(a,d+2);if(!rows[row])rows[row]=[];rows[row][c]=a[d+6]?'TRUE':'FALSE';}
   else if(id===0x0201){const row=u16(a,d),c=u16(a,d+2);if(!rows[row])rows[row]=[];rows[row][c]=biffLabel(a,d+6,e);}
   else if(id===0x0006){
     const row=u16(a,d),c=u16(a,d+2);if(!rows[row])rows[row]=[];
     // BIFF8 FORMULA 的结果区：字符串结果不是看 d+12 的字节类型，
     // 而是结果前两个字节为 0xFFFF。旧版这里判断错了，导致少数公式生成的 A-D 选项全部丢失。
     const stringResult=(u16(a,d+6)===0xFFFF && u16(a,d+8)===0xFFFF);
     if(stringResult) pendingFormulaStringCell={row,c};
     else rows[row][c]=String(f64(a,d+6));
   }
   else if(id===0x0207 && pendingFormulaStringCell){
     const {row,c}=pendingFormulaStringCell;
     const str=biffLabel(a,d,e);
     if(!rows[row])rows[row]=[]; rows[row][c]=str;
     pendingFormulaStringCell=null;
   }
   else if(id===0x00BD){const row=u16(a,d),c=u16(a,d+2),n=u16(a,d+4);if(!rows[row])rows[row]=[];for(let j=0;j<n;j++){const off=d+6+j*6;const rk=u32(a,off+2);let v=(rk&2)?(i32(a,off+2)>>2):0;if(!(rk&2)){const tmp=new Uint8Array(8);tmp.set(a.subarray(off+2,off+6));v=f64(tmp,0);}if(rk&1)v/=100;rows[row][c+j]=String(v);}}
 }
 return rows.filter(Boolean).map(r=>{const x=[];for(let i=0;i<r.length;i++)x[i]=r[i]??'';return x;});
}
async function parseXLS(file){const buf=await file.arrayBuffer();return rowsToQuestions(parseXLSBytes(buf))}
async function parseXLSX(file){const bytes=new Uint8Array(await file.arrayBuffer());const files=await unzip(bytes);const xml=await textFile(files,'xl/workbook.xml'),rels=await textFile(files,'xl/_rels/workbook.xml.rels');const xd=new DOMParser().parseFromString(xml,'application/xml'),rd=new DOMParser().parseFromString(rels,'application/xml');const map={};rd.querySelectorAll('Relationship').forEach(x=>map[x.getAttribute('Id')]=x.getAttribute('Target'));const sh=xd.querySelector('sheet');if(!sh)throw new Error('找不到工作表');let target=map[sh.getAttribute('r:id')];if(!target)throw new Error('找不到工作表路径');if(!target.startsWith('xl/'))target='xl/'+target.replace(/^\//,'');const sheet=await textFile(files,target);let shared=[];if(files['xl/sharedStrings.xml']){const sx=new DOMParser().parseFromString(await textFile(files,'xl/sharedStrings.xml'),'application/xml');sx.querySelectorAll('si').forEach(si=>shared.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')))}const doc=new DOMParser().parseFromString(sheet,'application/xml'),rows=[];doc.querySelectorAll('sheetData row').forEach(r=>{const vals=[];r.querySelectorAll(':scope > c').forEach(c=>{const ref=c.getAttribute('r')||'';const m=ref.match(/([A-Z]+)/);const col=m?colNum(m[1]):vals.length;while(vals.length<col)vals.push('');let v=c.querySelector('v')?.textContent||'';if(c.getAttribute('t')==='s')v=shared[+v]??'';else if(c.getAttribute('t')==='inlineStr')v=[...c.querySelectorAll('t')].map(t=>t.textContent).join('');vals[col]=v});rows.push(vals)});return rowsToQuestions(rows)}
function colNum(s){let n=0;for(const c of s)n=n*26+c.charCodeAt(0)-64;return n-1}
async function unzip(b){const view=new DataView(b.buffer,b.byteOffset,b.byteLength);let p=-1;for(let i=b.length-22;i>=0&&i>b.length-66000;i--){if(view.getUint32(i,true)===0x06054b50){p=i;break}}if(p<0)throw new Error('不是有效 XLSX');const count=view.getUint16(p+10,true),off=view.getUint32(p+16,true),files={};let pos=off;for(let i=0;i<count;i++){if(view.getUint32(pos,true)!==0x02014b50)break;const method=view.getUint16(pos+10,true),cs=view.getUint32(pos+20,true),nl=view.getUint16(pos+28,true),el=view.getUint16(pos+30,true),cl=view.getUint16(pos+32,true),lo=view.getUint32(pos+42,true);const name=new TextDecoder().decode(b.slice(pos+46,pos+46+nl));const lp=lo+30+view.getUint16(lo+26,true)+view.getUint16(lo+28,true);let data=b.slice(lp,lp+cs);if(method===8){const ds=new DecompressionStream('deflate-raw');data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer())}else if(method!==0)throw new Error('XLSX压缩格式不支持');files[name]=data;pos+=46+nl+el+cl}return files}
async function textFile(files,path){if(!files[path])throw new Error('缺少 '+path);return new TextDecoder('utf-8').decode(files[path])}
